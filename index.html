<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:rgba(60,60,67,.18);--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--bar:rgba(249,249,249,.85)}

:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#8e8e93;--sep:rgba(84,84,88,.6);--blue:#0a84ff;--bar:rgba(29,29,30,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#d1d1d6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--tx)}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}

.page{flex:1;overflow-y:auto;padding:0 16px 24px;display:none}.page.on{display:block}
h1{font-size:34px;font-weight:700;letter-spacing:.3px;margin:28px 0 14px}
.lbl{font-size:13px;color:var(--tx2);margin:22px 16px 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative;cursor:pointer}
.row+.row:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;font-size:17px}.row .t span{font-size:13px;color:var(--tx2)}
.chk{color:var(--blue);font-size:20px}
.pill{font-size:13px;color:var(--tx2)}
.tabbar{display:flex;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:6px 0 10px}
.tab{flex:1;text-align:center;font-size:10px;color:var(--tx2);cursor:pointer;border:0;background:none;padding:2px 0}
.tab svg{display:block;margin:0 auto 2px;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;margin-top:14px;cursor:pointer}
.btn.g{background:var(--card);color:var(--blue)}
.btn:active{opacity:.7}
/* live */
#live{background:#000;color:#fff;padding:0;--tx2:#8e8e93}
#live.on{display:flex;flex-direction:column}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:#ebebf5cc}
.dot{width:9px;height:9px;border-radius:50%;background:#636366}
.dot.listening{background:var(--orange);animation:pulse 1s infinite}.dot.locked{background:var(--green)}.dot.lost{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.meter{display:flex;gap:3px;align-items:flex-end;height:18px}.meter i{width:4px;background:#48484a;border-radius:2px;height:4px;transition:height .08s}
.song{padding:6px 20px 0;color:#8e8e93;font-size:14px}
.lyrics{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 24px;text-align:left}
.ln{font-size:22px;font-weight:600;color:#3a3a3c;transition:all .35s ease;line-height:1.35}
.ln.cur{font-size:34px;font-weight:700;color:#fff}.ln.nx{font-size:26px;color:#8e8e93}.ln.pv{color:#48484a}
.prog{height:3px;background:#2c2c2e;margin:0 24px;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}
.lact{display:flex;gap:10px;padding:16px 20px 20px}

.lact button.main{background:#0a84ff;color:#fff}
/* 调试面板（仅开发模式可见） */
.dbg{margin:0 20px 8px;padding:10px 12px;border-radius:10px;background:#1c1c1e;font:12px/1.6 ui-monospace,Menlo,monospace;color:#8e8e93;display:none;max-height:38%;overflow:auto}
.dbg label{display:flex;align-items:center;gap:8px;margin-top:8px;color:#ebebf5}
.dbg input[type=range]{flex:1;min-width:0}
.dbg select{flex:1;min-width:0;background:#2c2c2e;color:#fff;border:0;border-radius:8px;padding:6px}
.dbg b{color:#fff;font-weight:600;min-width:2.2em}
.dbg .act{background:#2c2c2e}
/* sheet */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);color:var(--tx);border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:6}
.sheet.on{transform:none}.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.sheet h3{margin:6px 0 12px;font-size:17px;text-align:center}
.sw{width:51px;height:31px;border-radius:16px;background:#78788033;position:relative;transition:.25s;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.25s}
.sw.on{background:var(--green)}.sw.on:after{left:22px}
.note{font-size:13px;color:var(--tx2);margin:8px 16px;line-height:1.5}
.imp{display:block;text-align:center;color:var(--blue);padding:14px;font-size:17px;cursor:pointer}
.more{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--blue);font-size:18px;line-height:1;cursor:pointer;flex:none}.sheet input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:0;background:var(--card);color:var(--tx);font-size:17px}.act{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;background:var(--card);color:var(--blue);margin-top:8px;cursor:pointer}.act.red{color:var(--red)}
.recd{width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1s infinite}
.copt{display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;margin-bottom:8px}
.seg{display:flex;background:rgba(118,118,128,.4);border-radius:8px;padding:2px}.seg button{border:0;background:none;color:#fff;font-size:13px;padding:4px 10px;border-radius:6px}.seg button.on{background:#636366}
.cmode{display:flex;justify-content:center;gap:22px;margin-bottom:10px}.cmode button{border:0;background:none;color:#fff;font-size:15px;font-weight:600;opacity:.7}.cmode button.on{color:#ffd60a;opacity:1}
.crow{display:flex;align-items:center;justify-content:space-around}
.shut{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:none;padding:0;position:relative}.shut:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff;transition:.2s}
.shut.v:after{background:#ff3b30}.shut.rec:after{inset:20px;border-radius:6px;background:#ff3b30}
.cb{width:46px;height:46px;border-radius:12px;border:0;background:rgba(118,118,128,.5);color:#fff;font-size:20px;overflow:hidden;padding:0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:fl .25s}@keyframes fl{from{opacity:.8}to{opacity:0}}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(60,60,67,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}
.gi .th{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#000;flex:none}.gi .th img,.gi .th video{width:100%;height:100%;object-fit:cover}.gi>button{border:0;background:none;color:var(--blue);font-size:15px}
#pv{position:absolute;inset:0;background:#000;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center}#pv.on{display:flex}#pv img,#pv video{max-width:100%;max-height:80%}#pv button{position:absolute;top:16px;right:16px}
#live>*{position:relative;z-index:1}#live>video{position:absolute;z-index:0;top:50%;left:50%;right:auto;bottom:auto;width:auto;height:min(100%,calc(100% / var(--cam-ratio,1.7777778)));max-width:100%;max-height:100%;aspect-ratio:var(--cam-ratio,1.7777778);object-fit:cover;display:none;background:#111}#live.cam>video{display:block}#live>.flash{position:absolute;inset:0;z-index:3}
#live.cam.sh .ln{text-shadow:0 1px 10px rgba(0,0,0,.85)}#live.cam .ln.pv{color:#ffffff88}
#live.cam.top .lyrics{justify-content:flex-start;padding-top:14px}#live.cam.bot .lyrics{justify-content:flex-end;padding-bottom:14px}
#cc{padding:8px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.camb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.camb:active{opacity:.7}.camb.on{background:rgba(120,120,128,.58);border-color:rgba(255,255,255,.3)}.camb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app.cam .tabbar{display:none}#live.cam .song,#live.cam .prog,#live.cam .meter,#live.cam .dbg{display:none!important}
#aa{display:none;margin:8px 16px 0;padding:6px 14px 12px;border-radius:14px;background:rgba(28,28,30,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}#aa.on{display:block}
.aal{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin-top:10px}.aal input[type=range]{flex:1;max-width:160px}
.cb.snap{background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}.cb.snap:after{content:"";width:30px;height:30px;border-radius:50%;border:2px solid #000}
.lact button.main{flex:2}
.navrow{display:flex;align-items:flex-end;justify-content:space-between}.addb{color:var(--blue);font-size:17px;padding:0 4px 14px;cursor:pointer}
#live{background:var(--lbg,#000);color:var(--ltx,#fff)}.status{color:inherit;opacity:.85}
.lyrics{font-family:var(--lfont,inherit);text-align:var(--lal,left)}.ln{font-weight:var(--lw,600);line-height:var(--llh,1.35)}.ln.cur{color:var(--lcur,#fff);font-weight:var(--lw,700)}.ln.nx{color:var(--lnx,#8e8e93)}
#live.lt .lact button,#live.lt .camb{background:#e5e5ea;color:#007aff}#live.lt .song{color:#6c6c70}
.seg2{display:flex;background:var(--bg);border-radius:8px;padding:2px;gap:2px}.seg2 button{border:0;background:none;color:var(--tx);font-size:13px;padding:5px 9px;border-radius:6px;cursor:pointer}.seg2 button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);color:var(--blue);font-weight:600}
.sws{display:flex;gap:8px}.sws button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}.sws button.on{border-color:var(--tx)}
#setc select{background:var(--bg);color:var(--tx);border:0;border-radius:8px;padding:6px 8px;font-size:15px}#setc input[type=range]{width:130px}#setc input[type=color]{width:38px;height:30px;border:0;background:none;padding:0}
.rv{font-size:13px;color:var(--tx2);width:40px;text-align:right}.chip{flex:1;border:0;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:600;background:var(--bg);color:var(--blue);cursor:pointer}.row.pre{gap:8px}
.setsec{margin:0 0 10px}
.sethead{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--card);color:var(--tx);text-align:left;cursor:pointer}
.sethead:active{opacity:.7}
.sethead .t{flex:1;min-width:0}
.sethead b{display:block;font-size:17px;font-weight:600}
.sethead .setsummary{display:block;margin-top:2px;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sethead .setchev{font-size:24px;line-height:1;color:var(--tx2);transform:rotate(90deg);transition:transform .2s ease}
.setsec.closed .setchev{transform:rotate(0)}
.setbody{margin-top:6px}
.setbody>.group{margin-top:0}
.setsec .note{margin-bottom:0}
/* 开发模式指示（仅开发模式显示） */
.devb{display:none;font-size:12px;color:var(--orange);font-weight:600;margin-left:10px;vertical-align:middle}
:root[data-dev="1"] .devb{display:inline}
/* 5 段式分段控件在小屏收紧 */
.seg2.w5 button{padding:5px 6px;font-size:12px}

@media (orientation:landscape) and (max-height:559px){
#app{max-width:none;flex-direction:row;height:100%}

/* ===== v2.0 Opal-like visual layer ===== */
:root{
  --ui-bg:#050706;--ui-card:rgba(25,29,28,.72);--ui-card-solid:#171b1a;--ui-text:#f7fbf8;--ui-sub:#9ba7a0;--ui-line:rgba(255,255,255,.10);
  --ui-glass:rgba(20,24,23,.72);--ui-accent:#d8ffd8;--ui-accent-2:#b5ffce;--ui-shadow:0 16px 44px rgba(0,0,0,.34);
}
:root[data-theme="light"]{
  --ui-bg:#f4f7f4;--ui-card:rgba(255,255,255,.82);--ui-card-solid:#fff;--ui-text:#111513;--ui-sub:#68736c;--ui-line:rgba(25,35,30,.10);
  --ui-glass:rgba(250,252,250,.80);--ui-accent:#173d25;--ui-accent-2:#1f6840;--ui-shadow:0 14px 36px rgba(36,56,42,.12);
}
html,body{background:var(--ui-bg)}
#app{background:var(--ui-bg)}
.page:not(#live){padding-bottom:110px}
.group{background:var(--ui-card)!important;border:1px solid var(--ui-line);box-shadow:var(--ui-shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.row+.row:before{border-top-color:var(--ui-line)!important}.note,.lbl{color:var(--ui-sub)!important}
.btn{border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 28px rgba(0,0,0,.16)}
:root[data-theme="light"] .btn{box-shadow:0 10px 24px rgba(46,86,58,.12)}

/* Live: English brand + left aligned state */
#live{padding:0 0 132px!important;background:#050706!important;position:relative;overflow:hidden}
#live:not(.cam){background:radial-gradient(circle at 50% 40%,rgba(179,255,205,.075),transparent 26%),radial-gradient(circle at 18% 80%,rgba(96,168,120,.045),transparent 22%),#050706!important}
#live .lhead{position:relative;z-index:8;display:flex;align-items:flex-start;justify-content:space-between;min-height:84px;padding:18px 18px 0}
.live-brand{display:flex;flex-direction:column;align-items:flex-start;flex:1;min-width:0;gap:7px}
.live-brand>span{display:block;color:rgba(255,255,255,.96);font-size:15px;font-weight:800;letter-spacing:.16em;line-height:1;text-shadow:0 0 22px rgba(185,255,215,.12)}
.live-brand .status{align-self:flex-start;display:flex;align-items:center;gap:7px;min-height:18px;max-width:calc(100% - 160px);color:rgba(231,238,234,.72);font-size:12px;line-height:1.35;text-align:left;opacity:1}
.live-brand .status .dot{width:6px;height:6px;flex:0 0 6px}
.live-head-right{position:relative;z-index:9;display:flex;align-items:center;gap:8px!important;flex:none}
#live #meter{display:none!important}
#live .camb{position:relative;z-index:10;width:38px;height:38px;min-width:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14)!important;background:rgba(30,35,34,.72)!important;color:#f5faf7!important;box-shadow:0 8px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center}
#live .camb svg{display:block!important;width:19px!important;height:19px!important;opacity:1!important;visibility:visible!important;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#live #camBtn{display:flex!important;visibility:visible!important;opacity:1!important}
#live .mrecb{opacity:.72}.mrecb{position:relative;overflow:hidden}.mrecb .mrec-pulse{position:absolute;inset:7px;border:1.5px solid currentColor;border-radius:50%;opacity:0}.mrecb.active .mrec-pulse{animation:mrecPulse 1.25s ease-out infinite}.mrecb.active .mrec-wave{animation:mrecWave .85s ease-in-out infinite alternate}
@keyframes mrecPulse{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.45);opacity:0}}@keyframes mrecWave{from{transform:scaleY(.65)}to{transform:scaleY(1.15)}}

/* Lyrics / progress */
#live .song{position:relative;z-index:2;padding:4px 20px 0;color:rgba(220,231,224,.44);font-size:12px;letter-spacing:.02em}
#live .lyrics{position:relative;z-index:2;padding:0 24px;gap:18px}
#live .ln{text-shadow:none;font-weight:600;letter-spacing:.01em}.ln.cur{position:relative;color:#f7fff9!important;text-shadow:0 0 28px rgba(191,255,212,.14)}
#live .ln.nx{color:rgba(221,231,225,.45)!important}#live .ln.pv{color:rgba(221,231,225,.16)!important}
#live .prog{position:relative;z-index:2;height:2px;margin:0 24px 8px;background:rgba(255,255,255,.08)}#live .prog i{background:linear-gradient(90deg,#9cffb7,#f2fff5)!important;box-shadow:0 0 12px rgba(181,255,206,.34)}

/* Main actions keep clear separation from floating nav */
#live .lact{position:relative;z-index:12;display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));margin:0 0 58px}
#live .lact button{min-height:50px;border-radius:17px;border:1px solid rgba(255,255,255,.10);background:rgba(24,29,27,.76)!important;color:#e6f7eb!important;box-shadow:0 10px 24px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#live .lact button.main{background:linear-gradient(135deg,#deffe8,#bafed0)!important;color:#102117!important;border-color:rgba(220,255,231,.58)!important;box-shadow:0 10px 28px rgba(147,255,180,.16),inset 0 1px 0 rgba(255,255,255,.9)}
#live .act-ico,#live .main-dot{display:none!important}

/* Floating bottom nav, never in normal flow */
.tabbar{position:absolute!important;left:50%!important;right:auto!important;bottom:max(10px,env(safe-area-inset-bottom,0px))!important;transform:translateX(-50%)!important;width:calc(100% - 34px)!important;max-width:360px!important;min-height:62px;z-index:20!important;padding:5px 6px 7px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:22px!important;background:rgba(24,29,27,.78)!important;box-shadow:0 16px 42px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(24px)!important;-webkit-backdrop-filter:blur(24px)!important}
.tabbar .tab{padding:5px 0 3px!important;border-radius:16px;font-size:10px;color:rgba(235,243,238,.50)!important}.tabbar .tab svg{width:22px!important;height:22px!important;margin-bottom:2px!important}.tabbar .tab.on{color:#e8ffee!important;background:rgba(210,255,225,.09)!important}

/* Camera mode: pure black video canvas; no leftover stage decoration */
#live.cam,#live.cam::before,#live.cam::after{background:#000!important;background-image:none!important;box-shadow:none!important}
#live.cam>*::before,#live.cam>*::after{content:none!important;display:none!important}
#live.cam #cv{z-index:0!important;background:#000!important}
#live.cam #cc{position:absolute;left:0;right:0;bottom:0;z-index:12!important;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.78) 48%,rgba(0,0,0,.94))}
#live.cam .cmode button{color:rgba(255,255,255,.68);padding:7px 12px;border-radius:999px}.cmode button.on{color:#fff;background:rgba(255,255,255,.10)!important}
#live.cam .shut{width:78px;height:78px;box-shadow:0 6px 22px rgba(0,0,0,.28)}
#live.cam .cb{background:rgba(24,27,26,.70)!important;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#live.cam .lhead{min-height:68px}#live.cam .live-brand{display:none}

/* Music recognition sheet */
#mrec{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center}#mrec.on{display:flex}
.mrec-sheet{width:100%;max-width:430px;background:rgba(28,28,30,.96);color:#fff;border-radius:20px 20px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.28);text-align:center}.mrec-grab{width:36px;height:5px;border-radius:3px;background:#636366;margin:0 auto 18px}.mrec-state{font-size:13px;color:#8e8e93;min-height:20px;margin-bottom:8px}.mrec-icon{width:74px;height:74px;margin:8px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2c2c2e;color:#bafed0}.mrec-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mrec-title{font-size:27px;font-weight:700}.mrec-artist{margin-top:5px;font-size:15px;color:#8e8e93}.mrec-score{margin:14px auto 16px;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:#2c2c2e;color:#ebebf5;font-size:13px}.mrec-dot{width:7px;height:7px;border-radius:50%;background:#34c759}.mrec-actions{display:flex;gap:10px;margin-top:8px}.mrec-actions button{flex:1;border:0;border-radius:14px;padding:14px 0;font-size:16px;font-weight:600;background:#2c2c2e;color:#bafed0}.mrec-actions button.main{background:linear-gradient(135deg,#deffe8,#bafed0);color:#102117}.mrec-demo{margin:10px 0 0;font-size:12px;color:#636366;line-height:1.45}.mrec-loading{font-size:14px;color:#ebebf5}.mrec-loading i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#bafed0;animation:mrecDot .9s infinite}.mrec-loading i:nth-child(2){animation-delay:.15s}.mrec-loading i:nth-child(3){animation-delay:.3s}@keyframes mrecDot{0%,70%,100%{transform:translateY(0);opacity:.35}35%{transform:translateY(-4px);opacity:1}}

/* Gallery refresh */
.gi{align-items:flex-start!important}.gi .th{width:84px;height:84px;border-radius:12px;overflow:hidden;background:#000;flex:none}.gi .th img,.gi .th video{width:100%;height:100%;object-fit:cover}.gi .t{padding-top:2px}.gi .t b{font-size:16px}.gi .t span{display:block;line-height:1.45;margin-top:3px}.gi-actions{display:flex;gap:6px;flex:none;margin-left:auto}.gi-actions button{min-width:44px;height:34px;padding:0 10px;border:0;border-radius:10px;background:var(--bg);color:var(--blue);font-size:14px}.gi-actions button.red{color:var(--red)}
.pv-actions{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}.pv-actions .act{position:static!important;flex:1;margin-top:0}
.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}.gallery-head .count{font-size:13px;color:var(--tx2)}.gallery-head button{border:0;background:none;color:var(--blue);font-size:15px;padding:6px 2px}.gallery-tools{display:flex;gap:8px}.gallery-tools button{background:var(--card);border:0;border-radius:12px;padding:10px 12px;color:var(--blue);font-size:14px}.gallery-tools button.red{color:var(--red)}

:root[data-theme="light"] body{background:#e6ebe7}.page:not(#live){background:radial-gradient(circle at 12% 0%,rgba(111,181,130,.11),transparent 28%),radial-gradient(circle at 92% 18%,rgba(104,186,181,.10),transparent 24%),#f4f6f4}

/* ===== v2.1 Opal UI refinement: color + floating navigation only ===== */
:root{
  --bg:#060807;
  --card:rgba(19,22,21,.84);
  --tx:#f4fbf5;
  --tx2:rgba(222,235,226,.56);
  --sep:rgba(255,255,255,.075);
  --blue:#c9ffb1;
  --green:#b9ff9a;
  --red:#ff6f73;
  --orange:#ffd27d;
  --bar:rgba(18,22,20,.78);
  --opal-mint:#c9ffb1;
  --opal-aqua:#79e7dc;
  --opal-lime:#b8ff83;
  --opal-soft:#e8ffe1;
}
:root[data-theme="dark"]{
  --bg:#060807;
  --card:rgba(19,22,21,.84);
  --tx:#f4fbf5;
  --tx2:rgba(222,235,226,.56);
  --sep:rgba(255,255,255,.075);
  --blue:#c9ffb1;
  --green:#b9ff9a;
  --bar:rgba(18,22,20,.78);
}
html,body{
  background:#0d100e;
}
#app{
  background:var(--bg);
}
.page:not(#live){
  background:
    radial-gradient(circle at 10% 0%,rgba(201,255,177,.055),transparent 24%),
    radial-gradient(circle at 90% 18%,rgba(121,231,220,.045),transparent 20%),
    var(--bg);
}
.group{
  background:rgba(18,22,20,.78);
  border:1px solid rgba(255,255,255,.055);
  box-shadow:0 10px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.018);
}
.row{
  background:transparent;
}
.row+.row:before{border-top-color:rgba(255,255,255,.055)}
.row .t b{color:#f2fbf4}
.row .t span,.note{color:rgba(221,235,226,.52)}
.lbl{
  color:rgba(210,228,216,.42);
  letter-spacing:1.1px;
}
.chk,.addb,.imp{color:var(--opal-mint)}
.btn{
  background:linear-gradient(135deg,var(--opal-soft),var(--opal-aqua));
  color:#0b130d;
  box-shadow:0 10px 28px rgba(125,235,190,.16),inset 0 1px 0 rgba(255,255,255,.75);
}
.btn.g{
  background:rgba(24,29,27,.82);
  color:var(--opal-mint);
  border:1px solid rgba(201,255,177,.12);
}
/* Opal-like floating navigation: keep the same three tabs and labels */
.tabbar{
  position:absolute!important;
  left:50%!important;
  right:auto!important;
  bottom:max(9px,env(safe-area-inset-bottom,0px))!important;
  transform:translateX(-50%)!important;
  width:calc(100% - 28px)!important;
  max-width:360px!important;
  min-height:62px;
  display:flex;
  align-items:stretch;
  gap:4px;
  padding:5px 6px 7px!important;
  border:1px solid rgba(255,255,255,.085)!important;
  border-radius:22px!important;
  background:rgba(19,23,21,.78)!important;
  box-shadow:0 16px 38px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter:blur(24px) saturate(130%);
  -webkit-backdrop-filter:blur(24px) saturate(130%);
  z-index:30!important;
}
.tabbar .tab{
  flex:1;
  border:0!important;
  border-radius:16px;
  color:rgba(232,241,235,.46)!important;
  background:transparent!important;
  font-size:10px;
  font-weight:550;
  padding:5px 0 4px!important;
  transition:background .2s ease,color .2s ease,transform .2s ease;
}
.tabbar .tab svg{
  width:23px!important;
  height:23px!important;
  margin:0 auto 2px!important;
  stroke-width:1.7;
}
.tabbar .tab.on{
  color:#e8ffe1!important;
  background:rgba(201,255,177,.085)!important;
  box-shadow:inset 0 1px 0 rgba(231,255,224,.035);
}
.tabbar .tab:active{transform:scale(.97)}
/* The floating nav is out of normal flow; preserve visible bottom actions. */
.page:not(#live){padding-bottom:104px}
#live{padding-bottom:0}
#live .lact{
  margin-bottom:74px;
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
}
/* Live scene: use Opal's muted black + luminous mint/aqua, without changing layout. */
#live{
  background:
    radial-gradient(circle at 50% 25%,rgba(201,255,177,.045),transparent 24%),
    radial-gradient(circle at 50% 70%,rgba(121,231,220,.035),transparent 28%),
    #050706;
}
#live:before{opacity:.58}
#live:after{opacity:.32}
.live-brand span{color:rgba(216,238,220,.52)}
.status{
  background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.085);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.camb{
  background:rgba(255,255,255,.055)!important;
  border-color:rgba(255,255,255,.11)!important;
  color:#e9faec!important;
}
.camb.on{
  background:rgba(201,255,177,.14)!important;
  color:var(--opal-soft)!important;
  border-color:rgba(201,255,177,.20)!important;
}
.meter i{background:rgba(201,255,177,.22)!important}
.lyrics:before{opacity:.62}
.lyrics:after{opacity:.42}
.ln.cur{
  color:#f4fbf5;
  text-shadow:0 0 22px rgba(201,255,177,.14),0 8px 26px rgba(0,0,0,.5);
}
.ln.nx{color:rgba(220,237,224,.40)}
.ln.pv{color:rgba(216,231,220,.16)}
.prog{background:rgba(255,255,255,.07)}
.prog i{
  background:linear-gradient(90deg,var(--opal-mint),var(--opal-aqua));
  box-shadow:0 0 11px rgba(190,255,205,.35);
}
.lact button{
  background:rgba(24,29,27,.72)!important;
  border-color:rgba(255,255,255,.085)!important;
  color:rgba(237,247,239,.82)!important;
  box-shadow:0 10px 26px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.035);
}
.lact button.main{
  background:linear-gradient(135deg,var(--opal-soft),var(--opal-aqua))!important;
  color:#102016!important;
  border-color:rgba(224,255,231,.58)!important;
  box-shadow:0 10px 28px rgba(137,246,199,.16),inset 0 1px 0 rgba(255,255,255,.84);
}
/* Sheets / controls use the same soft-glass hierarchy. */
.sheet{
  background:rgba(18,22,20,.96);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 -18px 42px rgba(0,0,0,.28);
  backdrop-filter:blur(22px) saturate(125%);
  -webkit-backdrop-filter:blur(22px) saturate(125%);
}
.sheet input[type=text]{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
}
.act{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.055);
  color:var(--opal-mint);
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.act.red{color:#ff8b88}
.sethead{
  background:rgba(18,22,20,.78);
  border-color:rgba(255,255,255,.055);
  box-shadow:0 10px 26px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.018);
}
.seg2{background:rgba(255,255,255,.065)}
.seg2 button{color:rgba(232,241,234,.62)}
.seg2 button.on{background:rgba(201,255,177,.11);color:#d7ffca;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.seg{background:rgba(255,255,255,.065)}
.seg button{color:rgba(238,247,240,.62)}
.seg button.on{background:rgba(201,255,177,.12);color:#dcffd0}
.sw.on{background:var(--opal-lime)}
#toast{background:rgba(23,27,25,.92);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* Light appearance: same hierarchy, inverse surface values. */
:root[data-theme="light"]{
  --bg:#f4f7f4;
  --card:rgba(255,255,255,.88);
  --tx:#172019;
  --tx2:rgba(41,57,46,.56);
  --sep:rgba(36,55,43,.10);
  --blue:#236d42;
  --bar:rgba(250,252,250,.84);
}
:root[data-theme="light"] body{background:#e6ebe7}
:root[data-theme="light"] .page:not(#live){
  background:
    radial-gradient(circle at 10% 0%,rgba(145,202,157,.14),transparent 27%),
    radial-gradient(circle at 90% 18%,rgba(125,194,188,.12),transparent 24%),

}
:root[data-theme="light"] .group,
:root[data-theme="light"] .sethead{
  background:rgba(255,255,255,.82);
  border-color:rgba(35,58,43,.075);
  box-shadow:0 10px 25px rgba(35,55,42,.07),inset 0 1px 0 rgba(255,255,255,.92);
}
:root[data-theme="light"] .row+.row:before{border-top-color:rgba(35,58,43,.065)}
:root[data-theme="light"] .row .t b,
:root[data-theme="light"] h1{color:#172019}
:root[data-theme="light"] .row .t span,
:root[data-theme="light"] .note,
:root[data-theme="light"] .lbl{color:rgba(43,59,48,.55)}
:root[data-theme="light"] .btn{
  background:linear-gradient(135deg,#e7fadd,#9cdcc1);
  color:#163320;
  box-shadow:0 10px 24px rgba(69,123,86,.12),inset 0 1px 0 rgba(255,255,255,.94);
}
:root[data-theme="light"] .btn.g{
  background:rgba(255,255,255,.84);
  color:#286d43;
  border-color:rgba(38,75,50,.08);
}
:root[data-theme="light"] .tabbar{
  background:rgba(255,255,255,.82)!important;
  border-color:rgba(32,51,39,.09)!important;
  box-shadow:0 15px 34px rgba(47,67,53,.12),inset 0 1px 0 rgba(255,255,255,.95);
}
:root[data-theme="light"] .tabbar .tab{color:rgba(34,54,41,.46)!important}
:root[data-theme="light"] .tabbar .tab.on{color:#214b31!important;background:rgba(51,127,76,.09)!important}
:root[data-theme="light"] .sheet{
  background:rgba(248,250,248,.95);
  color:#172019;
  border-color:rgba(35,58,43,.08);
}
:root[data-theme="light"] .sheet input[type=text]{background:#fff;color:#172019;border-color:rgba(35,58,43,.07)}
:root[data-theme="light"] .act{background:rgba(255,255,255,.88);color:#286d43;border-color:rgba(35,58,43,.07)}
:root[data-theme="light"] .act.red{color:#cc4841}
:root[data-theme="light"] #live .lact button{background:rgba(255,255,255,.86)!important;color:#21492f!important;border-color:rgba(34,64,44,.08)!important}
:root[data-theme="light"] #live .lact button.main{background:#214a2f!important;color:#fff!important;border-color:#214a2f!important}
:root[data-theme="light"] #live .camb{background:rgba(255,255,255,.78)!important;color:#1a2820!important;border-color:rgba(30,48,37,.10)!important}
:root[data-theme="light"] #live .ln.cur{color:#18251c!important;text-shadow:0 0 18px rgba(55,111,72,.08)}
:root[data-theme="light"] #live .ln.nx{color:rgba(29,46,35,.54)!important}
:root[data-theme="light"] #live .ln.pv{color:rgba(29,46,35,.18)!important}
:root[data-theme="light"] #live .prog{background:rgba(30,50,38,.10)}

:root[data-theme="light"] #live:before{opacity:.16}

@media (max-width:499px){
  .tabbar{width:calc(100% - 26px)!important}

/* ===== v2.2 UI collision fix + Chroma color system ===== */
:root{
  --nav-h:64px;
  --nav-bottom:10px;
  --nav-space:90px;
  --ui-mint:#c9ffb1;
  --ui-aqua:#79e7dc;
  --ui-lime:#b8ff83;
  --ui-dark:#07100b;
}
/* Navigation never covers content: pages reserve the measured floating-nav footprint. */
.page:not(#live){padding-bottom:calc(var(--nav-space) + env(safe-area-inset-bottom,0px))!important;}
#live{padding-bottom:calc(var(--nav-space) + 14px + env(safe-area-inset-bottom,0px))!important;}
#live.cam{padding-bottom:0!important;}
#live .lact{margin-bottom:0!important; padding-bottom:14px!important;}
/* sheets / preview / recognition must sit above the floating nav */
.mask{z-index:55!important;}
.sheet{z-index:60!important;}
#mrec{z-index:70!important;}
#pv{z-index:80!important;}
#toast{z-index:90!important;}
/* Sheets get bottom breathing room so the last action is never hidden under the home indicator. */
.sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px) + 8px)!important;max-height:min(88%,760px);overflow:auto;}
/* Floating nav: visually close to Opal but kept inside app bounds. */
.tabbar{
  bottom:max(var(--nav-bottom),env(safe-area-inset-bottom,0px))!important;
  width:min(calc(100% - 26px),360px)!important;
  min-height:var(--nav-h)!important;
  padding:5px!important;
  border-radius:24px!important;
  overflow:hidden;
}
.tabbar .tab{min-height:50px;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.tabbar .tab svg{flex:none!important;}
/* Preserve button dimensions and avoid text squeezing on narrow screens. */
#live .lact{gap:10px;}
#live .lact button{min-width:0;flex:1 1 0;}
#live .lact button.main{flex:1.18 1 0;}
/* Live header stays above ambient decoration. */
#live .lhead{z-index:15;}
#live #aa{z-index:20;}
/* Camera controls are a separate layer; no floating nav in camera mode. */
#live.cam #cc{z-index:35!important;}
#app.cam .tabbar{display:none!important;}
/* Touch targets remain at least 44px without changing the page's information architecture. */
.camb{min-width:36px;min-height:36px;}
/* Light mode: keep contrast while retaining the same Opal hierarchy. */
:root[data-theme="light"] .tabbar{background:rgba(250,253,250,.88)!important;}
:root[data-theme="light"] .sheet{background:rgba(248,250,248,.97)!important;}
/* Smaller devices: make the reserve area slightly denser but still collision-safe. */
@media (max-width:430px){
  :root{--nav-h:62px;--nav-bottom:8px;}
  .tabbar{width:calc(100% - 24px)!important;}
}
@media (orientation:landscape) and (max-height:559px){
  :root{--nav-h:56px;--nav-bottom:7px;}
  #live{padding-bottom:calc(var(--nav-space) + 8px)!important;}
  #live .lact{padding-bottom:8px!important;}
}


/* ===== v2.3: settings-driven live stage + collision-safe motion ===== */
:root{
  --scene-bg:#050706;
  --scene-cur:#f7fff9;
  --scene-nx:rgba(220,237,224,.42);
  --scene-pv:rgba(216,231,220,.16);
  --scene-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  --scene-fw:700;
  --scene-lh:1.35;
  --scene-align:left;
  --scene-shadow:0 0 22px rgba(201,255,177,.14),0 8px 26px rgba(0,0,0,.50);
}
/* One authoritative source for the floating-nav footprint. */
.page:not(#live){padding-bottom:calc(var(--nav-space) + env(safe-area-inset-bottom,0px))!important;}
#live{padding-bottom:calc(var(--nav-space) + 14px + env(safe-area-inset-bottom,0px))!important;}
#live.cam{padding-bottom:0!important;}
#live .lact{margin-bottom:0!important;}

/* Live stage color and typography now follow Settings instead of hard-coded colors. */
#live:not(.cam){background:var(--scene-bg)!important;}
#live .lyrics{font-family:var(--scene-font)!important;text-align:var(--scene-align)!important;}
#live .ln{font-family:var(--scene-font)!important;font-weight:var(--scene-fw)!important;line-height:var(--scene-lh)!important;}
#live .ln.cur{color:var(--scene-cur)!important;text-shadow:var(--scene-shadow)!important;}
#live .ln.nx{color:var(--scene-nx)!important;}
#live .ln.pv{color:var(--scene-pv)!important;}
#live .live-brand .status{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif!important;
  font-style:normal!important;font-weight:500!important;letter-spacing:0!important;
}
#live .live-brand .status .dot{font-family:inherit!important;}

/* Remove any accidental typography payload from the live status area. */
#live .live-brand .status select,
#live .live-brand .status input,
#live .live-brand .status .font,
#live .live-brand .status [data-font]{display:none!important;}

/* Chroma-driven stage wash. */
#live:not(.cam)::before{background:var(--scene-glow-1,transparent)!important;}
#live:not(.cam)::after{border-color:var(--scene-ring,rgba(255,255,255,.08))!important;box-shadow:var(--scene-ring-shadow,none)!important;}
#live:not(.cam) .lyrics::before{background:var(--scene-lyric-glow,radial-gradient(circle,transparent,transparent))!important;}
#live:not(.cam) .lyrics::after{background:var(--scene-lyric-ring,conic-gradient(transparent,transparent))!important;}
#live:not(.cam) .prog i{background:linear-gradient(90deg,var(--scene-accent,#c9ffb1),var(--scene-accent2,#79e7dc))!important;}

/* Opal-style motion surfaces. */
.nav-anim-target{will-change:transform,opacity;}
#live .ln{will-change:transform,opacity,filter;}
#live .lact button,#live .camb,.chip,.sethead,.tabbar .tab{will-change:transform;}
@media (prefers-reduced-motion:reduce){#live .ln,#live .lact button,#live .camb,.chip,.sethead,.tabbar .tab{will-change:auto;}}

/* Re-check the collision model at very narrow sizes. */
@media (max-width:380px){

/* ===== v2.3 behavior patch ===== */
var OPAL_SCENES={
  black:{base:'#050706',tone:'#c9ffb1',tone2:'#79e7dc'},
  navy:{base:'#08172a',tone:'#9ee7ff',tone2:'#9cb8ff'},
  plum:{base:'#26102b',tone:'#ffb2ee',tone2:'#b8c7ff'},
  forest:{base:'#092218',tone:'#a8f0cb',tone2:'#79e1c9'},
  ash:{base:'#1d2020',tone:'#d4e8d7',tone2:'#a9d5c6'},
  white:{base:'#eef6f0',tone:'#2f7d50',tone2:'#5eab7c'}
};
var OPAL_PRESETS=[
  ["暗场演出",{theme:"dark",accent:"#c9ffb1",bg:"black",cur:"#f7fff9",nxc:"rgba(220,237,224,.44)",fs:34,fw:700,font:"sys",dim:true,dimLv:.72,shadow:true,fade:true,al:"center"}],
  ["荧光应援",{theme:"dark",accent:"#ff8ad8",bg:"plum",cur:"#fff49b",nxc:"#ff9adf",fs:38,fw:800,font:"round",dim:false,shadow:true,fade:true,al:"center"}],
  ["白天户外",{theme:"light",accent:"#2f7d50",bg:"white",cur:"#163b25",nxc:"#4d795d",fs:36,fw:800,font:"sys",dim:false,shadow:false,fade:true,al:"center"}]
];
/* Keep PRE as the public source used by Settings. */
PRE=OPAL_PRESETS;

function _hexOr(color,fallback){try{return (window.chroma&&chroma.valid(color))?chroma(color).hex():fallback}catch(e){return fallback}}
function _rgba(color,a){try{return chroma(color).alpha(a).css()}catch(e){return color}}
function _sceneBase(){return OPAL_SCENES[P.bg]||OPAL_SCENES.black}
function _sceneIsLight(){return P.theme==="light" || (P.theme==="auto" && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) || P.bg==="white"}
function refreshChromaTheme(){
  var r=document.documentElement, sc=_sceneBase(), base=sc.base;
  var cur=_hexOr(P.cur,_sceneIsLight()?"#183022":"#f7fff9");
  var nx=_hexOr(P.nxc,_sceneIsLight()?"#50725d":"#9fb0a6");
  var tone=_hexOr(P.accent!=="auto"?P.accent:sc.tone,sc.tone);
  var tone2=_hexOr(sc.tone2,sc.tone2);
  try{
    var b=chroma(base), c=chroma(cur), a=chroma(tone), a2=chroma(tone2);
    var glow1=chroma.mix(b,a,_sceneIsLight()?.16:.20,'lch');
    var glow2=chroma.mix(b,a2,_sceneIsLight()?.11:.15,'lch');
    var ring=chroma.mix(a,a2,.5,'lch');
    var lyricGlow=_sceneIsLight()
      ? 'radial-gradient(circle, '+_rgba(glow1,.19)+' 0, '+_rgba(glow2,.09)+' 22%, transparent 66%)'
      : 'radial-gradient(circle, '+_rgba(glow1,.22)+' 0, '+_rgba(glow2,.11)+' 24%, transparent 68%)';
    var stageBg=_sceneIsLight()
      ? 'radial-gradient(circle at 50% 22%, '+_rgba(glow1,.16)+', transparent 27%), radial-gradient(circle at 88% 80%, '+_rgba(glow2,.10)+', transparent 24%), '+b.hex()
      : 'radial-gradient(circle at 50% 23%, '+_rgba(glow1,.13)+', transparent 26%), radial-gradient(circle at 16% 78%, '+_rgba(glow2,.08)+', transparent 23%), '+b.hex();
    r.style.setProperty('--scene-bg',stageBg);
    r.style.setProperty('--scene-glow-1',lyricGlow);
    r.style.setProperty('--scene-ring',_rgba(ring,_sceneIsLight()?.16:.20));
    r.style.setProperty('--scene-ring-shadow','0 0 80px '+_rgba(ring,_sceneIsLight()?.08:.12)+', inset 0 0 60px '+_rgba(a,_sceneIsLight()?.05:.07));
    r.style.setProperty('--scene-lyric-glow',lyricGlow);
    r.style.setProperty('--scene-lyric-ring','conic-gradient(from 210deg,transparent 0 38%, '+_rgba(a,.48)+' 55%, '+_rgba(a2,.28)+' 77%, transparent 92%)');
    r.style.setProperty('--scene-cur',cur);
    r.style.setProperty('--scene-nx',nx);
    r.style.setProperty('--scene-pv',_sceneIsLight()?_rgba(nx,.28):_rgba(nx,.18));
    r.style.setProperty('--scene-accent',a.hex());
    r.style.setProperty('--scene-accent2',a2.hex());
  }catch(e){
    r.style.setProperty('--scene-bg',base);
    r.style.setProperty('--scene-cur',cur);
    r.style.setProperty('--scene-nx',nx);
  }
  r.style.setProperty('--scene-font',FONTS[P.font]||FONTS.sys);
  r.style.setProperty('--scene-fw',String(P.fw||700));
  r.style.setProperty('--scene-lh',String(P.lh||1.35));
  r.style.setProperty('--scene-align',P.al==='right'?'right':P.al==='center'?'center':'left');
  r.style.setProperty('--scene-shadow',P.shadow?(_sceneIsLight()?'0 8px 26px rgba(57,102,75,.10)':'0 0 24px rgba(190,255,210,.14),0 8px 28px rgba(0,0,0,.52)'):'none');
}

function syncNavSpace(){
  var root=document.documentElement, app=document.getElementById('app'), nav=document.querySelector('.tabbar');
  if(!app||!nav){return}
  if(app.classList.contains('cam') || getComputedStyle(nav).display==='none'){
    root.style.setProperty('--nav-space','0px');return;
  }
  var ar=app.getBoundingClientRect(), nr=nav.getBoundingClientRect();
  var footprint=Math.ceil(Math.max(0,ar.bottom-nr.top)+12);
  root.style.setProperty('--nav-space',Math.max(88,footprint)+'px');
}

function uiAnimate(targets,props,duration,easing){
  try{
    if(window.anime && typeof window.anime==='function') return window.anime({targets:targets,duration:duration||360,easing:easing||'easeOutCubic',...props});
  }catch(e){}
  if(targets && targets.animate){
    var frames=[]; if(props.opacity)frames.push({opacity:props.opacity});
  }
}
var LAST_LYRIC="";
function animateNav(tab){
  if(!tab)return;
  try{if(window.anime)anime({targets:tab,scale:[.96,1],duration:360,easing:'easeOutElastic(1,.75)'});}
  catch(e){}
}
function animatePage(el){
  if(!el)return;
  try{if(window.anime)anime({targets:el,opacity:[.92,1],translateY:[5,0],duration:320,easing:'easeOutCubic'});}
  catch(e){}
}
function animateLyricState(){
  var cur=document.querySelector('#lyr .ln.cur');
  if(!cur)return;
  var txt=cur.textContent||'';
  if(txt!==LAST_LYRIC){
    LAST_LYRIC=txt;
    try{
      if(window.anime){
        anime.remove('#lyr .ln');
        anime({targets:cur,opacity:[.18,1],translateY:[8,0],scale:[.985,1],duration:500,easing:'easeOutCubic'});
        var nx=document.querySelector('#lyr .ln.nx');
        if(nx)anime({targets:nx,opacity:[.12,.72],translateY:[5,0],duration:420,easing:'easeOutCubic'});
      }
    }catch(e){}
  }
}

/* Override the visual part of draw(): functional state remains identical. */
var _drawCore=draw;
draw=function(){
  _drawCore();
  refreshChromaTheme();
  animateLyricState();
};

/* Settings changes should propagate immediately to the stage, including all text styles. */
var _applyStyleCore=applyStyle;
applyStyle=function(){
  _applyStyleCore();
  refreshChromaTheme();
  syncNavSpace();
};

/* Presets are now self-contained, so switching them cannot inherit stale scene colors. */
applyPreset=function(i){
  var cfg=(PRE[i]&&PRE[i][1])||{};
  Object.assign(P,cfg);
  if(P.bg==='white'){P.theme='light';}
  save();
  for(var k in P)onP(k);
  refreshChromaTheme();
  rerender();
  syncNavSpace();
  var msg=(PRE[i]&&PRE[i][0])||'方案';
  try{if(window.anime){anime({targets:'#p-set .chip',translateY:[2,0],opacity:[.78,1],delay:anime.stagger(35),duration:280,easing:'easeOutCubic'});}}catch(e){}
  toast('已应用「'+msg+'」');
};

/* go(): default screen is Live; tab transitions receive a small Opal-like entrance. */
var _goCore=go;
go=function(t){
  _goCore(t);
  var p=document.getElementById(PG[t]);
  animatePage(p);
  var b=document.querySelector('.tab[data-t="'+t+'"]');
  animateNav(b);
  setTimeout(syncNavSpace,0);
};

/* Ensure camera mode always releases the floating navigation footprint. */
var _camOnCore=camOn;
camOn=async function(){
  await _camOnCore();
  syncNavSpace();
};
var _camOffCore=camOff;
camOff=function(){
  _camOffCore();
  setTimeout(syncNavSpace,0);
};

/* No hidden/legacy text should appear in the live status cluster. */
(function sanitizeLiveStatus(){
  var status=document.querySelector('#live .status');
  if(status){status.setAttribute('aria-label','当前同频状态');}
})();

window.addEventListener('resize',function(){setTimeout(syncNavSpace,30);});
window.addEventListener('orientationchange',function(){setTimeout(syncNavSpace,120);});
if(window.ResizeObserver){
  var _nav=document.querySelector('.tabbar');
  if(_nav)new ResizeObserver(function(){syncNavSpace();}).observe(_nav);
}

st.mic=P.mic;CM.face=P.cam;CM.pos=P.pos;CM.op=P.op;CM.ratio=P.ratio||"auto";CM.burn=P.burn;
applyDevFlag();st.dbg=P.dbg&&DEV;
applyRatioUI();$("burn").classList.toggle("on",P.burn);applyStyle();renderSet();
renderSongs();draw();setStatus("idle");
/* Start from the Live interface without auto-starting recognition/camera. */
go("live");
refreshChromaTheme();syncNavSpace();
setTimeout(function(){syncNavSpace();animatePage($("live"));},60);
